<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="SkillOps — Offline Skills Matrix for Manufacturing">
  <title>SkillOps</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Styles -->
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/matrix.css">

  <!-- Optional libs (download to libs/ for full functionality) -->
  <!-- SheetJS — required for Excel import/export -->
  <script src="libs/xlsx.full.min.js" onerror="console.warn('[SkillOps] SheetJS not found — Excel features disabled')"></script>
  <!-- QR Code generator — optional, falls back to text display -->
  <script src="libs/qrcode.min.js" onerror="console.warn('[SkillOps] QRCode lib not found — text fallback active')"></script>

  <style>
    /* Inline critical: prevent flash of unstyled content */
    body { background: #0d0f12; }
    #app { min-height: 100vh; }

    /* Loading spinner shown before JS boots */
    #app-loading {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: #0d0f12;
      flex-direction: column;
      gap: 20px;
      z-index: 9999;
      transition: opacity 0.3s ease;
    }
    #app-loading .boot-logo {
      display: flex; align-items: center; gap: 16px;
    }
    #app-loading .boot-mark {
      width: 48px; height: 48px;
      background: #f97316;
      border-radius: 5px;
      display: flex; align-items: center; justify-content: center;
      font-family: 'IBM Plex Mono', monospace;
      font-weight: 700; font-size: 18px; color: #000;
    }
    #app-loading .boot-name {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 20px; font-weight: 700;
      color: #e8eaf0;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    #app-loading .boot-spinner {
      width: 24px; height: 24px;
      border: 2px solid #2a2f3a;
      border-top-color: #f97316;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Details/summary reset */
    details > summary { list-style: none; }
    details > summary::-webkit-details-marker { display: none; }

    /* Code */
    code {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      background: var(--bg-3);
      padding: 1px 5px;
      border-radius: 3px;
      color: var(--accent);
    }

    /* Opacity util */
    .opacity-50 { opacity: 0.5; pointer-events: none; }
  </style>
</head>
<body>

<!-- Boot screen -->
<div id="app-loading">
  <div class="boot-logo">
    <div class="boot-mark">SM</div>
    <div class="boot-name">SkillOps</div>
  </div>
  <div class="boot-spinner"></div>
</div>

<!-- App root -->
<div id="app"></div>

<!-- ════════════════════════════════════════════════════════════
     JS LOAD ORDER — critical, do not reorder
════════════════════════════════════════════════════════════ -->

<!-- Layer 1: DB -->
<script src="js/db/db.js"></script>

<!-- Layer 2: Domain logic (pure functions, no deps) -->
<script src="js/domain/skillSM.js"></script>
<script src="js/domain/rotation.js"></script>
<script src="js/domain/analysis.js"></script>
<script src="js/domain/templateMapper.js"></script>

<!-- Layer 3: State & i18n -->
<script src="js/state/translations.js"></script>
<script src="js/state/appState.js"></script>

<!-- Layer 4: UI primitives -->
<script src="js/ui/ui.js"></script>

<!-- Layer 5: Services (DB orchestration) -->
<script src="js/services.js"></script>

<!-- Layer 6: Pages -->
<script src="js/ui/pages.js"></script>

<!-- Layer 7: App bootstrap (last — runs init on DOMContentLoaded) -->
<script src="js/app.js"></script>

<script>
  // Hide boot screen once app has initialized
  // App.init() calls this after first render
  const _origInit = App.init.bind(App);
  // We hook by watching DOMContentLoaded completion
  window.addEventListener('load', () => {
    // Give the app a moment to boot then fade out the loader
    const loader = document.getElementById('app-loading');
    if (loader) {
      setTimeout(() => {
        loader.style.opacity = '0';
        setTimeout(() => loader.remove(), 350);
      }, 400);
    }
  });
</script>

</body>
</html>
